name: Prepare Hostinger artifact (no deploy)
on:
  workflow_dispatch:
  push:
    branches: [migration/hostinger-premium]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'danielperini/ponte-social-copy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, openssl, mbstring
          tools: composer:v2
          coverage: none
      - run: npm ci --no-audit --no-fund
      - run: composer install --working-dir=server --no-dev --prefer-dist --no-interaction --classmap-authoritative
      - run: php -l server/app.php
      - run: npm run build
        env:
          VITE_SITE_ORIGIN: ${{ vars.HOMOLOGATION_ORIGIN || 'https://homologacao.example.invalid' }}
      - run: npm run check:migration
      - run: node scripts/test-endpoints.mjs
      - run: npm run package:hostinger
      - run: tar -czf hostinger-staging.tar.gz -C release .
      - uses: actions/upload-artifact@v4
        with:
          name: hostinger-staging-${{ github.sha }}
          path: hostinger-staging.tar.gz
          retention-days: 14
